[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visiondrop"
version = "0.2.0"
description = "Webcam-based mid-air drag-and-drop using MediaPipe Tasks hand tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10.20",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "sounddevice>=0.5",
    "ultralytics>=8.3",
    "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
visiondrop = "visiondrop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
