[project]
name = "visiondrop"
version = "0.1.0"
description = "Touchless desktop interaction: hand tracking, pinch gestures, and screen-space overlay"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "mediapipe>=0.10.20",
    "opencv-contrib-python>=4.10",
    "absl-py>=2.1",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-Vision>=10.3",
    "mss>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
visiondrop = "visiondrop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visiondrop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
